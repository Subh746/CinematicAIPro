name: Build Cinematic AI Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: | ZIP_FILE="CinematicAIPro_Android_Full_Project.zip" if [ ! -f "$ZIP_FILE" ]; then echo "Upload CinematicAIPro_Android_Full_Project.zip to the repository root first." exit 1 fi mkdir -p source unzip -q "$ZIP_FILE" -d source 
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: source/CinematicAIPro
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CinematicAIPro-debug-apk
          path: source/CinematicAIPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
