name: Build Cinematic AI Pro APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract project ZIP
    run: |
      unzip -o CinematicAIPro_Android_Full_Project.zip

  - name: Build APK
    run: |
      cd CinematicAIPro
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: CinematicAIPro-APK
      path: CinematicAIPro/app/build/outputs/apk/debug/*.apk
