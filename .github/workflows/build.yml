- name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -e
          SETTINGS=$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle(.kts) not found"
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --stacktrace
