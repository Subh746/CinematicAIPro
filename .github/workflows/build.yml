name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract Android project ZIP
    run: |
      set -e
      ZIP=$(find . -maxdepth 2 -type f -iname 'CinematicAIPro_Android_Full_Project.zip' | head -n 1)
      if [ -z "$ZIP" ]; then
        echo "Project ZIP not found"
        exit 1
      fi
      mkdir project
      unzip -q "$ZIP" -d project
      echo "Extracted project files:"
      find project -maxdepth 3 -type f | head -100

  - name: Build debug APK
    run: |
      set -e
      GRADLEW=$(find project -type f -name gradlew | head -n 1)
      if [ -n "$GRADLEW" ]; then
        DIR=$(dirname "$GRADLEW")
        cd "$DIR"
        chmod +x gradlew
        ./gradlew assembleDebug
      else
        echo "gradlew not found. Checking available Gradle files."
        find project -type f -name 'build.gradle' -o -name 'build.gradle.kts'
        exit 1
      fi

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: CinematicAIPro-debug-apk
      path: project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
