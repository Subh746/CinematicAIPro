name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project ZIP
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname 'CinematicAIPro_Android_Full_Project.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -eo pipefail
          SETTINGS=$(find project -type f -name settings.gradle.kts | head -n 1)
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show compile errors
        if: failure()
        run: grep -E '^e: |error:' build.log || echo "No compiler errors found"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CinematicAIPro-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
