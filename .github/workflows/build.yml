name: Build debug APK
  working-directory: project/CinematicAIPro
  run: |
    set -e
    if [ -f "./gradlew" ]; then
      chmod +x ./gradlew
      ./gradlew assembleDebug
    elif [ -f "../gradlew" ]; then
      chmod +x ../gradlew
      ../gradlew -p . assembleDebug
    elif [ -f "../../gradlew" ]; then
      chmod +x ../../gradlew
      ../../gradlew -p . assembleDebug
    else
      echo "gradlew not found. Checking available Gradle files."
      find .. -name "gradlew" -type f
      exit 1
    fi
